name: Unity CI

# Chạy toàn bộ unit test của game Attrition (EditMode + PlayMode — hiện 126 test)
# trên GitHub Actions. Dùng game-ci/unity-test-runner (ảnh Unity headless trên Ubuntu).
#
# LƯU Ý về license: game-ci/unity-test-runner TỰ xử lý activation — chỉ cần secret UNITY_LICENSE
# (nội dung file .ulf cho license Personal, hoặc file license Pro). KHÔNG dùng game-ci/unity-activate:
# action đó (kể cả main mới nhất) build image với hậu tố dockerRepoVersion = 1, mà ảnh Unity 6
# trên Docker Hub chỉ có hậu tố 3/3.2/3.2.2 → "unityci/editor:ubuntu-6000.3.15f1-linux-il2cpp-1:
# not found". test-runner dùng containerRegistryImageVersion mặc định = 3 → pull ảnh hợp lệ.

on:
  pull_request:
    branches: [main]
    paths:
      - "Attrition_Game/**"
      - ".github/workflows/unity-ci.yml"

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Attrition_Game
          unityVersion: auto
          testMode: ${{ matrix.testMode }}
          # EditMode tests cần editor-only assembly; playmode chạy scene trống.
          # Không dùng customParameters — mặc định headless đã đủ.

      - name: Upload test results
        # always() nhưng guard artifactsPath: nếu bước test fail sớm (license...), path rỗng
        # → upload-artifact báo "Input required and not supplied: path".
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v4
        with:
          name: Unity test results (${{ matrix.testMode }})
          path: ${{ steps.tests.outputs.artifactsPath }}

# ── Secret cần cấu hình trong repo (Settings → Secrets and variables → Actions):
#    UNITY_LICENSE — nội dung file license Unity dưới dạng text.
#      * Unity Personal: activate qua Unity Editor (Window → Manage License → Manual Activation),
#        tải file .ulf, đặt NỘI DUNG text của file đó vào secret.
#      * Unity Pro / Plus (serial): có thể dùng UNITY_SERIAL (27 ký tự) thay cho UNITY_LICENSE.
#    test-runner cũng đọc UNITY_SERIAL nếu set (xem docs game.ci activation).
# Ghi chú đầy đủ: https://game.ci/docs/github/activation
