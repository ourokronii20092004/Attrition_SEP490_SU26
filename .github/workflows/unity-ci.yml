name: Unity CI

# Chạy unit test EDITMODE của game Attrition (logic thuần, không cần scene/Fusion runtime)
# trên GitHub Actions. Dùng game-ci/unity-test-runner (ảnh Unity headless trên Ubuntu).
#
# LƯU Ý: PlayMode KHÔNG chạy trong CI — activation license của game-ci đòi email+password
# tài khoản Unity, mà team dùng Google-signin nên không có password. PlayMode test chạy local
# qua Unity Test Runner (đã 126/126 pass).

on:
  pull_request:
    branches: [main]
    paths:
      - "Attrition_Game/**"
      - ".github/workflows/unity-ci.yml"

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run editmode tests
        id: tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Attrition_Game
          unityVersion: auto
          testMode: editmode
          # Không dùng customParameters — mặc định headless đã đủ.

      - name: Upload test results
        # always() nhưng guard artifactsPath: nếu bước test fail sớm (license...), path rỗng
        # → upload-artifact báo "Input required and not supplied: path".
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v4
        with:
          name: Unity EditMode test results
          path: ${{ steps.tests.outputs.artifactsPath }}

# ── Secrets cần cấu hình trong repo (Settings → Secrets and variables → Actions).
#    BẮT BUỘC: UNITY_EMAIL + UNITY_PASSWORD + (UNITY_LICENSE hoặc UNITY_SERIAL).
#    game-ci/unity-test-runner dùng UNITY_LICENSE để TRÍCH serial (đặt vào UNITY_SERIAL trong
#    container), rồi container activate bằng `-serial -username -password` → cần ĐỦ CẢ 3.
#    (Xem dist/platforms/ubuntu/activate.sh: nhánh SERIAL đòi UNITY_SERIAL+UNITY_EMAIL+UNITY_PASSWORD.)
#
#   Cách lấy:
#     UNITY_EMAIL / UNITY_PASSWORD — đăng nhập tài khoản Unity sở hữu license (Unity Hub).
#     UNITY_LICENSE = NỘI DUNG text file C:\ProgramData\Unity\Unity_lic.ulf (đã có trên máy).
#       Mở file bằng Notepad → Ctrl+A → Ctrl+C → dán vào secret. (ĐỪNG dán đường dẫn file.)
#
#   Lưu ý: nếu thiếu 1 trong 3 biến trên, container báo "No valid license activation strategy".
# Ghi chú đầy đủ: https://game.ci/docs/github/activation
